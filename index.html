<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عتمة — ٢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --text:#d6d6d6;
    --text-dim:#4a4a4a;
    --accent:#8a8a8a;
    --accent-soft:#8a8a8a33;
    --line:#161616;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ background:var(--bg); color:var(--text); font-family:'Cairo', sans-serif; overflow-x:hidden; position:relative; }
  body::before{
    content:""; position:fixed; inset:0; z-index:2; pointer-events:none; opacity:0.04;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
  }

  .fog{ position:fixed; border-radius:50%; filter:blur(70px); pointer-events:none; z-index:0; }
  .fog.f1{ width:58vw; height:58vw; top:-10%; right:-18%; opacity:0.13; background:radial-gradient(circle, #262626, transparent 70%); animation:drift1 50s ease-in-out infinite; }
  .fog.f2{ width:50vw; height:50vw; bottom:-18%; left:-12%; opacity:0.12; background:radial-gradient(circle, #202020, transparent 70%); animation:drift2 60s ease-in-out infinite; }
  .fog.f3{ width:38vw; height:38vw; top:45%; left:40%; opacity:0.1; background:radial-gradient(circle, #2a2a2a, transparent 70%); animation:drift3 68s ease-in-out infinite; }
  @keyframes drift1{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(-9vw,10vh);} }
  @keyframes drift2{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(11vw,-9vh);} }
  @keyframes drift3{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(6vw,-11vh);} }

  #wander-path{ position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }

  main{ position:relative; z-index:3; }

  .epigraph{ min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; }
  .epigraph .title{
    font-family:'Cairo', sans-serif; font-weight:900;
    font-size:clamp(2.6rem, 9vw, 5.5rem); color:var(--text);
    text-shadow:0 0 50px rgba(0,0,0,0.9), 0 0 2px var(--accent-soft);
    opacity:0; animation:fadeUp 2.4s ease forwards 0.3s;
    letter-spacing:0.02em;
  }
  .epigraph .part{
    margin-top:0.9rem; font-family:'Space Grotesk', sans-serif; font-size:0.8rem;
    color:var(--text-dim); letter-spacing:0.3em; direction:ltr;
    opacity:0; animation:fadeUp 2.4s ease forwards 0.7s;
  }
  .epigraph .hint{
    margin-top:3.2rem; font-size:0.8rem; color:var(--text-dim); letter-spacing:0.1em;
    opacity:0; animation:fadeUp 2.4s ease forwards 1.2s, bob 3.5s ease-in-out infinite 3.6s;
  }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);} }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);} }

  .line-section{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:4rem 1.5rem; text-align:center; position:relative; }
  .line-section .num{ position:absolute; top:2.5rem; font-family:'Space Grotesk', sans-serif; font-size:0.8rem; color:var(--text-dim); letter-spacing:0.1em; direction:ltr; opacity:0.45; }
  .line{ font-size:clamp(1.9rem, 5.4vw, 3.5rem); line-height:1.8; max-width:17ch; font-weight:700; opacity:0; transform:translateY(34px); filter:blur(4px); transition:opacity 1.5s ease, transform 1.5s ease, filter 1.5s ease; color:var(--text); }
  .line.visible{ opacity:1; transform:translateY(0); filter:blur(0); }
  .line-section.dim .line{ color:var(--text-dim); font-weight:600; }
  .line-section:nth-of-type(odd)::before{
    content:""; position:absolute; right:50%; bottom:1.5rem; transform:translateX(50%);
    width:1px; height:3rem; background:linear-gradient(to bottom, transparent, var(--line));
  }

  .nav-forward{
    min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:3rem; gap:1.3rem;
  }
  .mark{ width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 16px 3px var(--accent-soft); opacity:0.7; }
  .nav-forward a{
    color:var(--text-dim); text-decoration:none; font-family:'Cairo', sans-serif;
    font-weight:600; font-size:clamp(1.2rem, 3.2vw, 1.7rem); letter-spacing:0.01em;
    transition:color 0.4s ease, text-shadow 0.4s ease;
  }
  .nav-forward a:hover{ color:var(--text); text-shadow:0 0 20px var(--accent-soft); }


  .photo-section{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:3rem 1.5rem; position:relative;
  }
  .photo-frame{
    position:relative; max-width:420px; width:100%;
    filter:grayscale(0.55) contrast(1.08) brightness(0.72);
  }
  .photo-frame img{
    display:block; width:100%; height:auto;
    opacity:0; transform:scale(1.04);
    transition:opacity 2.2s ease, transform 2.2s ease, filter 2.2s ease;
  }
  .photo-frame img.visible{ opacity:0.88; transform:scale(1); }
  .photo-frame::after{
    content:""; position:absolute; inset:0;
    box-shadow:inset 0 0 60px 20px rgba(0,0,0,0.9);
    pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
    .line{opacity:1; transform:none; filter:none;}
  }
</style>
</head>

<div class="fog f1"></div>
<div class="fog f2"></div>
<div class="fog f3"></div>

<svg id="wander-path" viewBox="0 0 100 100" preserveAspectRatio="none">
  <path id="ghost-path" d="M50,0 C80,12 10,20 60,32 C100,42 5,52 55,64 C90,74 15,82 50,92 C68,97 30,99 50,100"
    stroke="#1a1a1a" stroke-width="0.1" fill="none" stroke-dasharray="0.4 1.8" opacity="0.4"/>
  <circle id="wander-dot" r="0.45" fill="#8a8a8a" opacity="0.6">
    <animate attributeName="opacity" values="0.25;0.55;0.25" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>

<main>
  <section class="epigraph">
    <div class="title">عتمة</div>
    <div class="part">PART II / III</div>
    <div class="hint">— انزل ببطء —</div>
  </section>

  <section class="line-section">
    <span class="num">ix.</span>
    <p class="line">بس مبيسعفش</p>
  </section>

  <section class="line-section dim">
    <span class="num">x.</span>
    <p class="line">فبداوي جلدي بهموم بنكد</p>
  </section>

  <section class="line-section">
    <span class="num">xi.</span>
    <p class="line">ببلادة بإسراف وبروتوايلر</p>
  </section>

  <section class="line-section dim">
    <span class="num">xii.</span>
    <p class="line">تسهرش كثير مِش منيح لَك</p>
  </section>

  <section class="line-section">
    <span class="num">xiii.</span>
    <p class="line">تطلعش بالليل اهدا</p>
  </section>

  <section class="line-section dim">
    <span class="num">xiv.</span>
    <p class="line">بشوفش عيلتي</p>
  </section>

  <section class="line-section">
    <span class="num">xv.</span>
    <p class="line">زهقت الانتظار..</p>
  </section>

  <section class="line-section dim">
    <span class="num">xvi.</span>
    <p class="line">في الحرب فش ملائكة بس شيطان رجيم</p>
  </section>

<script>
  const lines = document.querySelectorAll('.line');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); } });
  }, {threshold:0.4});
  lines.forEach(l=>io.observe(l));

  const path = document.getElementById('ghost-path');
  const dot = document.getElementById('wander-dot');
  const pathLength = path.getTotalLength();
  function updateDot(){
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = docHeight > 0 ? Math.min(Math.max(scrollTop/docHeight, 0), 1) : 0;
    const point = path.getPointAtLength(progress * pathLength);
    dot.setAttribute('cx', point.x);
    dot.setAttribute('cy', point.y);
  }
  window.addEventListener('scroll', updateDot, {passive:true});
  window.addEventListener('resize', updateDot);
  updateDot();
</script>

    }, {threshold:0.5});
    pio.observe(photoImg2);
  }
